{{- $gateway := .Values.networkPolicy.gateway | default dict -}}
{{- if or (not $gateway.namespace) (not $gateway.podSelector) }}
  {{- fail "networkPolicy.gateway.namespace and networkPolicy.gateway.podSelector must both be set: the HTTP transport has no authentication of its own, so an empty selector would hand the configured token to the whole cluster" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: secobserve-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: secobserve-mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    # Both selectors in one list element mean "that namespace AND those pods"; two elements would mean "or".
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gateway.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $gateway.podSelector | nindent 14 }}
      ports:
        - port: 8931
          protocol: TCP
