replicaCount: 1

image:
  repository: ghcr.io/nh4ttruong/secobserve-mcp
  # Empty means the chart's appVersion; `latest` is never used, because it moves the tool surface under an already-configured client.
  tag: ""
  pullPolicy: IfNotPresent

# Replaces the image CMD rather than adding to it. `--shared-identity` is required from 0.5.0: the server refuses HTTP with a credential from the environment without it, and the flag forces read-only, which is why readOnly below is true.
args: ["--transport", "http", "--host", "0.0.0.0", "--shared-identity"]

secobserve:
  # Base URL without /api. Required.
  baseUrl: ""
  # The Secret is created by the operator and only referenced here; the chart never carries a token.
  tokenSecret:
    name: ""
    key: token
  # One token serves every caller of this port, so writes stay off until an operator decides otherwise.
  readOnly: true
  allowDelete: false

networkPolicy:
  # Required, and there is no way to render an empty selector: the HTTP transport has no authentication of its own.
  gateway:
    namespace: ""
    podSelector: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
