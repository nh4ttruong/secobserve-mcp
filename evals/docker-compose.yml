name: secobserve-evals

# The MCP server only ever talks to the REST API, so the frontend is not started.
# Traefik is not started either: it exists upstream to route by hostname, and the backend port is published directly here.

services:

  postgres:
    image: postgres:15.19-alpine
    environment:
      POSTGRES_DB: secobserve
      POSTGRES_USER: secobserve
      POSTGRES_PASSWORD: ${SO_DATABASE_PASSWORD:?generate it, never commit it}
    # tmpfs, so every run starts on an empty database -- the evaluation answers are counts.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secobserve -d secobserve"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    image: ghcr.io/secobserve/secobserve-backend:${SECOBSERVE_VERSION:?pin the SecObserve version}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SECOBSERVE_PORT:-8080}:5000"
    environment:
      ADMIN_USER: ${SO_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${SO_ADMIN_PASSWORD:?generate it, never commit it}
      ADMIN_EMAIL: admin@example.com
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_DB: secobserve
      DATABASE_USER: secobserve
      DATABASE_PASSWORD: ${SO_DATABASE_PASSWORD:?generate it, never commit it}
      # The backend always allows localhost and 127.0.0.1; this only has to be set.
      ALLOWED_HOSTS: localhost
      CORS_ALLOWED_ORIGINS: http://localhost
      DJANGO_SECRET_KEY: ${SO_DJANGO_SECRET_KEY:?generate it, never commit it}
      FIELD_ENCRYPTION_KEY: ${SO_FIELD_ENCRYPTION_KEY:?generate a urlsafe base64 32-byte key, never commit it}
      GUNICORN_WORKERS: 2
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/api/status/health/"]
      interval: 5s
      timeout: 10s
      # The first start migrates, then downloads the SPDX and ScanCode license lists before gunicorn listens.
      retries: 120
