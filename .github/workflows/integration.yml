name: Integration

# Never on pull requests. This job stands up a real SecObserve, so it is slower and has more ways to go wrong than
# the rest of CI, and a job people learn to ignore on the PR path is worth nothing when it goes red for a real reason.
on:
  workflow_dispatch:
    inputs:
      secobserve_version:
        description: SecObserve release to run the evaluation against
        default: "1.59.2"
        type: string
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: integration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Every fact in AGENTS.md was verified against 1.59.2; a run against another release is the compatibility matrix.
      SECOBSERVE_VERSION: ${{ inputs.secobserve_version || '1.59.2' }}
      SECOBSERVE_PORT: "8080"
      SECOBSERVE_BASE_URL: http://localhost:8080
      SECOBSERVE_IMPORT_DIR: ${{ runner.temp }}/seed-import
      SO_ADMIN_USER: admin
      COMPOSE_FILE: evals/docker-compose.yml
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.11"

      - run: uv sync --extra dev

      # Generated per run and masked: nothing credential-shaped belongs in the repository.
      - name: Generate instance credentials
        run: |
          for name in SO_DATABASE_PASSWORD SO_ADMIN_PASSWORD SO_DJANGO_SECRET_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          # Fernet, so this one has to be urlsafe base64 of 32 bytes rather than hex.
          key=$(openssl rand -base64 32 | tr '+/' '-_')
          echo "::add-mask::$key"
          echo "SO_FIELD_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"

      # The first start migrates and loads the SPDX and ScanCode license lists before gunicorn listens, so --wait
      # returning means the API is actually up.
      - name: Start SecObserve
        run: |
          echo "SecObserve $SECOBSERVE_VERSION"
          docker compose up --detach --wait --wait-timeout 900

      - name: Mint an API token
        run: |
          body=$(jq -n --arg u "$SO_ADMIN_USER" --arg p "$SO_ADMIN_PASSWORD" '{username: $u, password: $p, name: "integration"}')
          response=$(curl -sS -X POST "$SECOBSERVE_BASE_URL/api/authentication/create_user_api_token/" -H 'Content-Type: application/json' -d "$body")
          token=$(jq -er .token <<<"$response") || { echo "::error::no API token was issued: $response"; exit 1; }
          echo "::add-mask::$token"
          echo "SECOBSERVE_API_TOKEN=$token" >> "$GITHUB_ENV"

      # Seeding goes through the server's own tools, so this is the end-to-end check of create, import and assessment.
      - name: Seed the evaluation dataset
        run: |
          # The backend loads the SPDX and ScanCode license lists from the internet at startup and logs a failure
          # rather than failing, so a missing Standard policy is how a blocked or broken download shows up here.
          policies=$(curl -sS -H "Authorization: APIToken $SECOBSERVE_API_TOKEN" "$SECOBSERVE_BASE_URL/api/license_policies/?name=Standard" | jq -r .count)
          [ "$policies" = "1" ] || { echo "::error::the backend's startup license import did not create the Standard license policy"; exit 1; }
          uv run python evals/seed.py

      - name: Answer evaluation.xml
        run: uv run python evals/check.py

      - name: Backend log
        if: failure()
        run: docker compose logs --tail 300 backend

      - name: Stop SecObserve
        if: always()
        run: docker compose down --volumes
